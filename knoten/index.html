<!doctype html>
<html lang="de">
<head>

<title>Knoten – Entwirre die Fäden</title>
<style>
  :root {
    --ink: #ece4d4;
    --muted: rgba(236, 228, 212, 0.55);
    --faint: rgba(236, 228, 212, 0.32);
    --line: rgba(236, 228, 212, 0.12);
    --gold: #dcbc80;
    --gold2: #f3e2b8;
    --coral: #e08a6d;
    --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #141210; color: var(--ink);
    font-family: var(--sans); -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; }

  .bg { position: fixed; inset: 0; transition: opacity 1.6s ease; }
  #grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.55; mix-blend-mode: overlay; background-size: 180px 180px; }
  #vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 75% at 50% 45%, transparent 45%, rgba(0,0,0,0.5) 100%); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- Kopfzeile ---------- */
  .hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .hud > * { pointer-events: auto; }
  .ib {
    width: 44px; height: 44px; border-radius: 14px; flex: none; padding: 0; cursor: pointer;
    border: 1px solid var(--line); background: rgba(255,255,255,0.035);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display: grid; place-items: center; touch-action: manipulation;
    transition: transform .18s cubic-bezier(.3,1.6,.5,1), background .2s, opacity .3s;
  }
  .ib:active { transform: scale(0.9); background: rgba(255,255,255,0.09); }
  .ib:disabled { opacity: 0.28; }
  .ib svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ttl { flex: 1; min-width: 0; text-align: center; padding-top: 1px; pointer-events: none; }
  .ttl .ch { font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
  .ttl .lv { font-family: var(--serif); font-size: 22px; line-height: 1.15; margin-top: 3px; letter-spacing: 0.01em; }
  .rbtns { display: flex; gap: 8px; }
  .hint-on { animation: hintpulse 1.6s ease; }
  @keyframes hintpulse { 30% { background: rgba(220,188,128,0.18); border-color: rgba(220,188,128,0.5); } }

  /* Zeitleiste mit Sternmarken */
  .timer { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; padding-left: 46px; }
  .tbar { position: relative; width: min(130px, 30vw); height: 2px; border-radius: 2px; background: var(--line); }
  .tbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--gold), var(--gold2)); transform-origin: left; }
  .tbar.low i { background: var(--coral); }
  .tbar b {
    position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; transform: rotate(45deg);
    background: var(--gold2); box-shadow: 0 0 6px rgba(243,226,184,0.7); transition: background .4s, box-shadow .4s;
  }
  .tbar b.off { background: #3a342d; box-shadow: none; }
  #tTxt { font-family: var(--serif); font-size: 15px; font-variant-numeric: tabular-nums; min-width: 36px; text-align: left; color: var(--muted); transition: color .3s; }
  #tTxt.low { color: var(--coral); animation: tick 1s ease-in-out infinite; }
  @keyframes tick { 0% { opacity: 1; } 50% { opacity: 0.55; } }

  #pill {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%);
    font-size: 13px; letter-spacing: 0.05em; color: var(--muted); white-space: nowrap; pointer-events: none;
    padding: 7px 15px; border-radius: 999px; border: 1px solid var(--line); background: rgba(0,0,0,0.2);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-variant-numeric: tabular-nums;
    transition: opacity .5s, color .3s, border-color .3s, transform .3s; z-index: 4;
  }
  #pill.zero, #pill.info { color: var(--gold); border-color: rgba(220,188,128,0.45); }
  #pill.bump { transform: translateX(-50%) scale(1.06); }
  #pill.hide { opacity: 0; }
  #tip {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 62px); transform: translate(-50%, 8px);
    width: min(360px, 86vw); text-align: center; font-family: var(--serif); font-style: italic;
    font-size: 17px; line-height: 1.4; color: var(--ink); opacity: 0; pointer-events: none; z-index: 4;
    transition: opacity .9s ease, transform .9s ease; text-shadow: 0 1px 12px rgba(0,0,0,0.6);
  }
  #tip.show { opacity: 0.88; transform: translate(-50%, 0); }

  /* ---------- Ergebnis-Karte ---------- */
  #card {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 6;
    width: min(420px, calc(100vw - 28px)); padding: 22px 20px 18px; text-align: center;
    border-radius: 26px; border: 1px solid rgba(236,228,212,0.14);
    background: linear-gradient(180deg, rgba(30,27,24,0.72), rgba(16,14,12,0.78));
    -webkit-backdrop-filter: blur(20px) saturate(1.15); backdrop-filter: blur(20px) saturate(1.15);
    box-shadow: 0 30px 80px -24px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
    opacity: 0; transform: translate(-50%, 40px) scale(0.98); pointer-events: none;
    transition: opacity .6s ease, transform .8s cubic-bezier(.16,1,.3,1);
  }
  #card.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  #card .cap { font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
  #card h2 {
    font-family: var(--serif); font-weight: 400; font-size: 36px; margin: 6px 0 2px; color: var(--gold2);
    letter-spacing: 0.3em; opacity: 0; transition: letter-spacing 1.4s cubic-bezier(.16,1,.3,1), opacity 1s ease;
  }
  #card.show h2 { letter-spacing: 0.02em; opacity: 1; }
  #card.lost h2 { color: var(--ink); }
  .stars { display: flex; justify-content: center; gap: 16px; margin: 12px 0 4px; height: 22px; }
  #card.lost .stars { display: none; }
  .stars i {
    width: 15px; height: 15px; transform: rotate(45deg) scale(0.4); opacity: 0; border-radius: 2px;
    border: 1.5px solid rgba(220,188,128,0.5); margin-top: 3px;
    transition: transform .6s cubic-bezier(.3,1.8,.5,1), opacity .4s ease, background .3s, box-shadow .3s;
  }
  .stars i.in { opacity: 1; transform: rotate(45deg) scale(1); }
  .stars i.on { background: linear-gradient(135deg, #fff1cf, #dcbc80 55%, #a98446); border-color: #f3e2b8; box-shadow: 0 0 14px rgba(232,196,128,0.65); }
  .stats { display: flex; justify-content: center; gap: 28px; margin: 12px 0 4px; }
  .stats div { display: flex; flex-direction: column; gap: 2px; opacity: 0; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease; }
  #card.show .stats div { opacity: 1; transform: none; }
  #card.show .stats div:nth-child(1) { transition-delay: .25s; }
  #card.show .stats div:nth-child(2) { transition-delay: .35s; }
  #card.show .stats div:nth-child(3) { transition-delay: .45s; }
  .stats b { font-family: var(--serif); font-weight: 400; font-size: 21px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  .note { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 15px; line-height: 1.4; margin-top: 10px; }
  .note:empty { display: none; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; height: 50px; border-radius: 16px; cursor: pointer; touch-action: manipulation;
    border: 1px solid rgba(220,188,128,0.5); font-size: 16px; letter-spacing: 0.04em;
    background: linear-gradient(180deg, rgba(220,188,128,0.28), rgba(220,188,128,0.14)); color: var(--gold2);
    transition: transform .18s cubic-bezier(.3,1.6,.5,1), background .2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn.ghost { flex: 0 0 auto; padding: 0 18px; border-color: var(--line); background: rgba(255,255,255,0.03); color: var(--muted); }

  /* ---------- Menü / Galerie ---------- */
  #menu {
    position: fixed; inset: 0; z-index: 10; display: none; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: rgba(10, 9, 8, 0.72); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
  }
  #menu.open { display: block; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; } }
  .mwrap {
    width: min(560px, 100%); margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 30px) calc(env(safe-area-inset-left) + 18px);
  }
  #menu.open .mwrap { animation: rise .5s cubic-bezier(.16,1,.3,1); }
  @keyframes rise { from { transform: translateY(18px); opacity: 0.4; } }
  .mhead { display: flex; align-items: center; gap: 12px; }
  .brand { flex: 1; }
  .brand b { display: block; font-family: var(--serif); font-weight: 400; font-size: 30px; letter-spacing: 0.02em; }
  .brand span { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 15px; }
  .opts { display: flex; gap: 8px; margin: 18px 0 8px; flex-wrap: wrap; }
  .tg {
    height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer;
    background: rgba(255,255,255,0.03); color: var(--muted); font-size: 14px; touch-action: manipulation;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .tg i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); transition: background .2s, box-shadow .2s; }
  .tg.on { color: var(--ink); }
  .tg.on i { background: var(--gold); box-shadow: 0 0 8px rgba(220,188,128,0.7); }
  .tg:active { transform: scale(0.96); }
  .total { margin-left: auto; align-self: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chap { margin-top: 26px; }
  .chap h3 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; font-weight: 400; }
  .chap h3 b { font-family: var(--serif); font-weight: 400; font-size: 21px; }
  .chap h3 span { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); }
  .chap h3 em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tile {
    position: relative; aspect-ratio: 1; border-radius: 14px; border: 1px solid var(--line); padding: 0; overflow: hidden;
    background: rgba(255,255,255,0.025); cursor: pointer; touch-action: manipulation;
    display: grid; place-items: center; transition: transform .18s cubic-bezier(.3,1.6,.5,1), border-color .2s;
  }
  .tile:active { transform: scale(0.94); }
  .tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tile .n { position: relative; font-family: var(--serif); font-size: 17px; color: var(--muted); }
  .tile.solved .n { position: absolute; right: 6px; bottom: 4px; font-size: 11px; color: rgba(255,255,255,0.75); text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  .tile .st { position: absolute; left: 7px; bottom: 7px; display: flex; gap: 3px; }
  .tile .st i { width: 4px; height: 4px; transform: rotate(45deg); background: rgba(255,255,255,0.22); }
  .tile .st i.on { background: var(--gold2); box-shadow: 0 0 4px rgba(243,226,184,0.8); }
  .tile.cur { border-color: rgba(220,188,128,0.6); box-shadow: 0 0 0 1px rgba(220,188,128,0.25), 0 0 18px -4px rgba(220,188,128,0.5); }
  .tile.cur .n { color: var(--gold2); }
  .tile.locked { cursor: default; opacity: 0.35; }
  .tile.locked .n { font-size: 0; }
  .tile.locked .n::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
  .foot { margin-top: 30px; text-align: center; font-family: var(--serif); font-style: italic; color: var(--faint); font-size: 14px; line-height: 1.5; }

</style>
</head>
<body>
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB" style="opacity:0"></div>
<div id="grain"></div>
<div id="vig"></div>
<canvas id="c"></canvas>

<header class="hud" id="hud">
  <button class="ib" id="bMenu" aria-label="Level und Galerie">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/><path d="M7.2 7.2 16.8 16.8"/></svg>
  </button>
  <div class="ttl">
    <div class="ch" id="tChap">Leinen</div>
    <div class="lv" id="tLevel">Level 1</div>
    <div class="timer">
      <div class="tbar" id="tBar"><i id="tFill"></i><b style="left:25%"></b><b style="left:50%"></b></div>
      <span id="tTxt">0:00</span>
    </div>
  </div>
  <div class="rbtns">
    <button class="ib" id="bUndo" aria-label="Rückgängig" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 7 5 11l4 4"/><path d="M5 11h9a5 5 0 0 1 0 10h-2"/></svg>
    </button>
    <button class="ib" id="bHint" aria-label="Tipp (kostet 10 Sekunden)">
      <svg viewBox="0 0 24 24"><path d="M9.5 17.5h5M10 20.5h4"/><path d="M12 3.5a5.5 5.5 0 0 0-3.2 10c.6.5 1 1.2 1 2v.5h4.4v-.5c0-.8.4-1.5 1-2A5.5 5.5 0 0 0 12 3.5z"/></svg>
    </button>
  </div>
</header>

<div id="pill">–</div>
<div id="tip"></div>

<div id="card">
  <div class="cap" id="cCap">Level 1 · Leinen</div>
  <h2 id="cTitle">Entwirrt</h2>
  <div class="stars" id="cStars"><i></i><i></i><i></i></div>
  <div class="stats">
    <div><b id="cTime">0:00</b><span>Zeit</span></div>
    <div><b id="cMoves">0</b><span>Züge</span></div>
    <div><b id="cRopes">0</b><span>Kordeln</span></div>
  </div>
  <div class="note" id="cNote"></div>
  <div class="row">
    <button class="btn ghost" id="cAlt">Nochmal</button>
    <button class="btn" id="cMain">Weiter</button>
  </div>
</div>

<div id="menu">
  <div class="mwrap">
    <div class="mhead">
      <div class="brand"><b>Knoten</b><span>Entwirre die Fäden</span></div>
      <button class="ib" id="mClose" aria-label="Schließen">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="opts">
      <button class="tg" id="oSound"><i></i>Klang</button>
      <button class="tg" id="oVib"><i></i>Vibration</button>
      <button class="tg" id="oRestart">Neu starten</button>
      <span class="total" id="mTotal"></span>
    </div>
    <div id="chapters"></div>
    <div class="foot">Ziehe die Enden der Kordeln in freie Ösen, bis sich keine mehr kreuzen.<br>Wer unten liegt, hängt fest – wer oben liegt, gleitet frei darüber.<br>Löse den Knoten von oben nach unten.</div>
  </div>
</div>

<script>
/* =====================================================================
   Seilphysik für „Knoten“
   Jede Kordel ist eine Kette aus Gliedern im Raum (x, y in Rastereinheiten,
   z = Höhe über dem Brett). Kordeln sind dick, elastisch, liegen durch
   Schwerkraft auf dem Brett und können einander nicht durchdringen –
   darum entstehen Umschlingungen und Verdrehungen von selbst.
   Die Enden stecken in Ösen. Ein gegriffenes Ende wird angehoben und
   über alles hinweggeführt; die Kordel schleift hinterher.
   Läuft im Browser und in Node (für die Level-Erzeugung).
   ===================================================================== */
(function (root) {
  "use strict";
  const RAD = 0.075;      // Radius einer Kordel
  const LIFT = 1.0;       // Höhe eines angehobenen Endes
  const N = 22;           // Glieder pro Kordel
  const G = 30;           // Schwerkraft
  const SUB = 6;          // Teilschritte pro Bild
  const DAMP = 0.985;
  const SPEED = 7;        // Höchsttempo eines gezogenen Endes (Einheiten/s)
  const D2 = 2 * RAD;

  function createWorld(cols, rows, ends) {
    const P = [];
    for (let h = 0; h < cols * rows; h++) P.push({ x: h % cols, y: Math.floor(h / cols) });
    const w = { cols, rows, P, ropes: [], drag: null };
    ends.forEach(([a, b]) => w.ropes.push(makeRope(P[a], P[b], a, b)));
    return w;
  }
  function makeRope(A, B, a, b) {
    const x = new Float64Array(N * 3);
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1);
      x[i * 3] = A.x + (B.x - A.x) * t;
      x[i * 3 + 1] = A.y + (B.y - A.y) * t;
      x[i * 3 + 2] = i === 0 || i === N - 1 ? 0 : RAD;
    }
    return { e: [a, b], x, p: x.slice(), tgt: [null, null] };
  }
  const endIdx = (e) => (e ? N - 1 : 0);

  // Ziel eines Endes: Öse (z = 0) oder angehoben über dem Finger
  function endTarget(w, r, e) {
    const R = w.ropes[r];
    if (w.drag && w.drag.r === r && w.drag.e === e) return { x: w.drag.x, y: w.drag.y, z: LIFT };
    const h = w.P[R.e[e]];
    return { x: h.x, y: h.y, z: 0 };
  }
  function restLen(w, R) {
    const a = R.x, i = (N - 1) * 3;
    const L = Math.hypot(a[i] - a[0], a[i + 1] - a[1]);
    return Math.max(0.35, L * 0.98) / (N - 1);
  }

  /* ---------- Nächste Punkte zweier Strecken im Raum ---------- */
  const cs = { s: 0, t: 0 };
  function closest(ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz) {
    const d1x = bx - ax, d1y = by - ay, d1z = bz - az, d2x = dx - cx, d2y = dy - cy, d2z = dz - cz;
    const rx = ax - cx, ry = ay - cy, rz = az - cz;
    const a = d1x * d1x + d1y * d1y + d1z * d1z, e = d2x * d2x + d2y * d2y + d2z * d2z, f = d2x * rx + d2y * ry + d2z * rz;
    let s, t;
    if (a < 1e-12 && e < 1e-12) { s = t = 0; }
    else if (a < 1e-12) { s = 0; t = Math.min(1, Math.max(0, f / e)); }
    else {
      const c = d1x * rx + d1y * ry + d1z * rz;
      if (e < 1e-12) { t = 0; s = Math.min(1, Math.max(0, -c / a)); }
      else {
        const b = d1x * d2x + d1y * d2y + d1z * d2z, den = a * e - b * b;
        s = den > 1e-12 ? Math.min(1, Math.max(0, (b * f - c * e) / den)) : 0;
        t = (b * s + f) / e;
        if (t < 0) { t = 0; s = Math.min(1, Math.max(0, -c / a)); }
        else if (t > 1) { t = 1; s = Math.min(1, Math.max(0, (b - c) / a)); }
      }
    }
    cs.s = s; cs.t = t;
  }

  /* ---------- Ein Teilschritt ---------- */
  // Kollisionssuche: Glieder nach linker Kante sortieren und nur Überlappungen prüfen
  let SEG = null, ORD = null, NSEG = 0;
  function collide(w) {
    const n = w.ropes.length * (N - 1);
    if (!SEG || NSEG !== n) { SEG = new Float64Array(n * 6); ORD = Int32Array.from({ length: n }, (_, i) => i); NSEG = n; }
    let id = 0;
    for (const R of w.ropes) {
      const x = R.x;
      for (let i = 0; i < N - 1; i++, id++) {
        const j = i * 3, k = j + 3, o = id * 6;
        SEG[o] = Math.min(x[j], x[k]) - D2; SEG[o + 1] = Math.max(x[j], x[k]) + D2;
        SEG[o + 2] = Math.min(x[j + 1], x[k + 1]) - D2; SEG[o + 3] = Math.max(x[j + 1], x[k + 1]) + D2;
        SEG[o + 4] = Math.min(x[j + 2], x[k + 2]) - D2; SEG[o + 5] = Math.max(x[j + 2], x[k + 2]) + D2;

      if (k <= 0 || k >= 1) continue;
      const p = P[r][Math.round((N - 1) * eOut(k))];
      glowAt(sprites.glow, p.x, p.y, 34, base * Math.sin(Math.PI * k));
    }
  }
  for (const r of state.rings) {
    const k = eOut(clamp((t - r.t0) / r.dur, 0, 1));
    ctx.globalAlpha = base * (1 - k) * 0.4; ctx.strokeStyle = rgba(GOLD_HI, 1); ctx.lineWidth = 1.5 + (1 - k) * 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + k * r.r, 0, TAU); ctx.stroke();
  }
  for (const p of state.particles) {
    const k = (t - p.t0) / p.life, fl = 0.75 + 0.25 * Math.sin(t * 0.012 + p.size * 7);
    glowAt(sprites.glow, p.x, p.y, p.size * (1 - k * 0.4), base * Math.sin(Math.PI * Math.min(1, k * 1.15)) * 0.9 * fl);
  }
  ctx.restore();
  ctx.restore();
}

/* =====================================================================
   Galerie / Levelauswahl
   ===================================================================== */
function renderThumb(cv, level) {
  const d = levelDef(level), sv = save.solved[level];
  const px = 128; cv.width = cv.height = px;
  const c = cv.getContext("2d");
  const sp = Math.min((px - 28) / (d.cols - 1), (px - 28) / (d.rows - 1));
  const ox = (px - sp * (d.cols - 1)) / 2, oy = (px - sp * (d.rows - 1)) / 2;
  const P = d.P.map((p) => ({ x: ox + p.x * sp, y: oy + p.y * sp }));
  c.fillStyle = chapterOf(level).bg[1]; c.fillRect(0, 0, px, px);
  for (const p of P) { c.beginPath(); c.arc(p.x, p.y, 2.6, 0, TAU); c.fillStyle = "rgba(200,166,104,0.55)"; c.fill(); }
  c.lineCap = "round";
  sv.ends.forEach(([a, b], i) => {
    const col = d.colors[i];
    c.beginPath(); c.moveTo(P[a].x, P[a].y); c.lineTo(P[b].x, P[b].y);
    c.lineWidth = 6; c.strokeStyle = "rgba(0,0,0,0.6)"; c.stroke();
    c.lineWidth = 4; c.strokeStyle = col; c.stroke();
    for (const h of [a, b]) { c.beginPath(); c.arc(P[h].x, P[h].y, 3.6, 0, TAU); c.fillStyle = col; c.fill(); c.lineWidth = 1; c.strokeStyle = "#d8b878"; c.stroke(); }
  });
}
function openMenu() {
  Sound.init();
  state.paused = true;
  const box = $("#chapters"); box.innerHTML = "";
  const maxLvl = Math.min(LEVEL_COUNT, Math.max(save.unlocked, state.level));
  const chapters = Math.min(Math.ceil(LEVEL_COUNT / 10), chapterIdx(maxLvl) + 1);
  const pending = [];
  let total = 0; for (const k in save.solved) total += save.solved[k].st || 0;
  $("#mTotal").textContent = total ? `${total} ◆` : "";
  for (let c = 0; c < chapters; c++) {
    const first = c * 10 + 1;
    const stars = range(10).map((k) => save.solved[first + k]?.st || 0).reduce((a, b) => a + b, 0);
    const sec = document.createElement("section"); sec.className = "chap";
    sec.innerHTML = `<h3><b>${chapterName(first)}</b><span>${first}–${first + 9}</span><em>${stars}/30 ◆</em></h3><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    for (let k = 0; k < 10; k++) {
      const lvl = first + k, b = document.createElement("button");
      if (lvl > LEVEL_COUNT) break;
      const sv = save.solved[lvl], open = lvl <= save.unlocked;
      b.className = "tile" + (sv ? " solved" : "") + (lvl === state.level ? " cur" : "") + (!open ? " locked" : "");
      b.innerHTML = `<span class="n">${lvl}</span>` + (sv ? `<span class="st">${[0, 1, 2].map((j) => `<i class="${j < sv.st ? "on" : ""}"></i>`).join("")}</span>` : "");
      if (sv) { const cv = document.createElement("canvas"); b.prepend(cv); pending.push([cv, lvl]); }
      if (open) b.addEventListener("click", () => { closeMenu(); if (lvl !== state.level || state.phase !== "play") nextLevel(lvl); });
      grid.appendChild(b);
    }
    box.prepend(sec);
  }
  $("#oSound").classList.toggle("on", !!save.sound);
  $("#oVib").classList.toggle("on", !!save.vib);
  $("#menu").classList.add("open");
  $("#menu").scrollTop = 0;
  let i = 0;
  const step = () => { const end = Math.min(pending.length, i + 4); for (; i < end; i++) renderThumb(pending[i][0], pending[i][1]); if (i < pending.length) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function closeMenu() { $("#menu").classList.remove("open"); state.paused = false; state.lastTick = now(); wake(); }

/* ---------- Knöpfe ---------- */
$("#bMenu").addEventListener("click", openMenu);
$("#mClose").addEventListener("click", closeMenu);
$("#menu").addEventListener("click", (e) => { if (e.target.id === "menu") closeMenu(); });
$("#bUndo").addEventListener("click", undo);
$("#bHint").addEventListener("click", hint);
$("#oRestart").addEventListener("click", restart);
$("#cMain").addEventListener("click", () => { if ($("#card").dataset.mode === "lost") nextLevel(state.level); else nextLevel(state.level + 1); });
$("#cAlt").addEventListener("click", () => { if ($("#card").dataset.mode === "lost") openMenu(); else nextLevel(state.level); });
$("#oSound").addEventListener("click", (e) => { save.sound = !save.sound; e.currentTarget.classList.toggle("on", save.sound); persist(); if (save.sound) { Sound.init(); Sound.tone(587.33, { dur: 1, vol: 0.08, bell: true }); } });
$("#oVib").addEventListener("click", (e) => { save.vib = !save.vib; e.currentTarget.classList.toggle("on", save.vib); persist(); haptic(10); });
document.addEventListener("keydown", (e) => {
  if ((e.key === "z" && (e.metaKey || e.ctrlKey)) || e.key === "Backspace") { e.preventDefault(); undo(); }
  else if (e.key === "h") hint();
  else if (e.key === "Escape") closeMenu();
  else if (e.key === "Enter" && state.phase === "won") nextLevel(state.level + 1);
  else if (e.key === "Enter" && state.phase === "lost") nextLevel(state.level);
});
window.addEventListener("resize", () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 60); });
document.addEventListener("visibilitychange", () => { state.lastTick = now(); if (document.hidden) saveCur(); else wake(); });
window.addEventListener("pagehide", () => saveCur());

/* ---------- Start ---------- */
resize();
const startLevel = save.cur && save.cur.level ? save.cur.level : Math.max(1, save.unlocked);
loadLevel(startLevel, { instantBg: true });

// Für Tests
window.__knoten = {
  state, save, levelDef, Rope,
  level: (n) => loadLevel(n, { fresh: true }),
  holeScreen: (h) => g2s(state.def.P[h]),
  endScreen: (r, e) => g2s(endGrid(r, e)),
};
})();

</script>
